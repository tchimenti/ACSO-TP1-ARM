name: Autograding Tests
on:
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: write
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install build essentials
      run: sudo apt-get update && sudo apt-get install -y build-essential
    - name: Compilation
      run: |
          cd src
          make clean || true
          make
    - name: Generating Tests
      run: |
          chmod +x .github/scripts/generate_dump.sh
          .github/scripts/generate_dump.sh
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-subtests
    - name: Test mandatory dumpsim
      id: python-test-mandatory
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Mandatory dumsimp Test"
        command: "pytest ./test/mandatory_test.py --verbose"
        timeout: '15'
        max-score: '1'
    - name: Test extra dumpsim
      id: python-test-secret
      run: |
        pytest ./test/mandatory_test.py ./test/extra_test.py --junitxml=report.xml > /dev/null || true
        python ./test/parse_results.py report.xml | tee autocorrecion_parcial.txt
    - name: Commit and Push results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add autocorrecion_parcial.txt
        
        git diff --quiet && git diff --staged --quiet || (git commit -m "Corrección" && git push)
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        PYTHON-TEST-MANDATORY_RESULTS: "${{steps.python-test-mandatory.outputs.result}}"
      with:
        runners: python-test-mandatory
   